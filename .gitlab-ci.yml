variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CI_BASE_IMAGE: "python:3.12"

.linux_aff3ct_base: &linux_aff3ct_base
  image: $CI_BASE_IMAGE
  tags:
    - x86
    - docker
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends gcc g++ cmake git lcov
    - python --version  # For debugging
    - python -m venv venv
    - . venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install pybind11==3.0.4  # same version as pyproject.toml

.python_cache: &python_cache
  key: ${CI_PROJECT_PATH}
  paths:
    - .cache/
    - venv/

stages:
  - linting
  - build
  - tests
  - coverage-linux
  - build-wheels
  - docs
  - deploy


build-linux:
  stage: build
  <<: *linux_aff3ct_base

  cache:
    <<: *python_cache

  artifacts:
    name: streampu
    paths:
      - streampu
      - venv

  script:
    - export CC="gcc"
    - export CXX="g++"
    - python -m pip install ../pystreampu -v -Ccmake.define.SPU_OVERRIDE_VERSION=v0.0.0
    - pwd && find


tests:
  stage: tests
  <<: *linux_aff3ct_base

  cache:
    <<: *python_cache

  dependencies:
    - build-linux

  script:
    - python -m pip show -f streampu
    - pytest tests --junitxml=report.xml

  artifacts:
    when: always
    reports:
      junit: report.xml


# Run the examples of the documentation and compare their results with the outputs
# written in the pages (the C++ module example is skipped: it is not built here)
tutorial:
  stage: tests
  <<: *linux_aff3ct_base

  cache:
    <<: *python_cache

  dependencies:
    - build-linux

  script:
    - python scripts/check_tutorial.py

# Check that the committed stubs of streampu._ext match the C++ bindings
stubs:
  stage: tests
  <<: *linux_aff3ct_base
  allow_failure: true

  cache:
    <<: *python_cache

  dependencies:
    - build-linux

  script:
    - python -m pip install pybind11-stubgen==2.5.5 black==26.5.1 isort==8.0.1  # same as pyproject.toml
    - python -m pip list 2>/dev/null | grep -i -E "^(pybind11|pybind11-stubgen|black|isort) "
    - ./scripts/generate_stubs.sh
    - git diff -- streampu/_ext > stubs.diff
    - test ! -s stubs.diff || (echo "Stubs are outdated, run scripts/generate_stubs.sh"; git diff --stat; head -n 80 stubs.diff; exit 1)

  artifacts:
    when: on_failure
    name: stubs-diff
    paths:
      - stubs.diff
    expire_in: 1 week


coverage-python:
  stage: coverage-linux
  <<: *linux_aff3ct_base

  cache:
    <<: *python_cache

  coverage: '/.*lines\.*: (\d+.\d+\%)/'
  artifacts:
    name: python-coverage-report
    when: always
    paths:
      - htmlcov/
      - coverage.lcov
  dependencies:
    - build-linux
  script:
    - python -m pip install pytest-cov
    - python -m pip install --verbose -e "$CI_PROJECT_DIR" -Ccmake.define.SPU_OVERRIDE_VERSION=v0.0.0
    - python -c "import streampu; print('streampu loaded from:', streampu.__file__); print('streampu path:', list(streampu.__path__))"
    - pytest tests --cov=streampu --cov-report=html --cov-report=term --cov-report=lcov

  only:
    - merge_requests

coverage-cpp:
  stage: coverage-linux
  <<: *linux_aff3ct_base
  timeout: 2h
  allow_failure: true

  cache:
    <<: *python_cache

  artifacts:
    name: cpp-coverage-report
    when: always
    paths:
      - code_coverage_report/
      - code_coverage_files/
    reports:
      junit: report-cpp.xml
  script:
    - python -m pip install lcov-cobertura
    - export CXX="g++"
    - export CFLAGS="-g -Wall -funroll-loops -fvisibility=hidden -fvisibility-inlines-hidden -coverage -ftest-coverage -fprofile-arcs"
    - export LFLAGS="-coverage -ftest-coverage -fprofile-arcs"
    - pwd
    - ./ci/coverage-cpp-linux.sh
  only:
    - merge_requests

isort:
  stage: linting
  <<: *linux_aff3ct_base

  script:
    - python -m pip install isort==8.0.1
    - isort ./streampu --check-only
    - isort ./examples --check-only

black:
  stage: linting
  <<: *linux_aff3ct_base

  script:
    - python -m pip install black==26.5.1
    - black --check ./streampu
    - black --check ./examples

flake8:
  stage: linting
  <<: *linux_aff3ct_base

  script:
    - python -m pip install flake8
    - flake8 ./streampu
    - flake8 ./examples


build-wheels-linux:
  stage: build-wheels
  image: $CI_BASE_IMAGE
  tags:
    - x86
    - docker

# make a docker daemon available for cibuildwheel to use
  services:
    - name: docker:dind
      entrypoint: ["env", "-u", "DOCKER_HOST"]
      command: ["dockerd-entrypoint.sh"]
  variables:
    NO_PROXY: "docker"
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    # See https://github.com/docker-library/docker/pull/166
    DOCKER_TLS_CERTDIR: ""
  parallel:
    matrix:
      - ARCHS: ["x86_64"] # aarch64
        PYTHON_TYPE: ["cp"]
        PYTHON_VERSION: ["38", "39", "310", "311", "312", "313"]
#      - ARCHS: ["x86_64"]
#        PYTHON_TYPE: ["pp"]
#        PYTHON_VERSION: ["38", "39", "310"]
  script:
    - curl -sSL https://get.docker.com/ | sh
    - python -m pip install cibuildwheel==2.21.3
    - python -m pip install twine
    - CIBW_BUILD="$PYTHON_TYPE$PYTHON_VERSION-*" cibuildwheel --platform linux  --archs $ARCHS --output-dir wheelhouse
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 hour

  only:
    - tags

testpypi:
  stage: deploy
  <<: *linux_aff3ct_base

  needs:
    - job: build-wheels-linux
      artifacts: true

  script:
    - python -m pip install twine
    - python -m twine upload --repository-url https://test.pypi.org/legacy/ --verbose wheelhouse/* -u $TWINE_USERNAME -p $TWINE_PASSWORD
    #-python3 -m twine ... ?

  only:
    - tags


# ---------------------------------------------------------------------------
# Documentation (MkDocs + GitLab Pages)
# ---------------------------------------------------------------------------
# The documentation does not need the compiled package: mkdocstrings reads the Python
# sources and the committed type stubs of streampu._ext (scripts/generate_stubs.sh), so
# these jobs only install MkDocs. Keep the package list in sync with the `docs` extra of
# pyproject.toml.
.docs_base: &docs_base
  image: $CI_BASE_IMAGE
  tags:
    - x86
    - docker
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install mkdocs mkdocs-material "mkdocstrings[python]" pymdown-extensions

# Check that the documentation builds on merge requests
docs:
  stage: docs
  <<: *docs_base
  script:
    - mkdocs build --strict --site-dir site
  artifacts:
    name: docs-preview
    paths:
      - site/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Publish the documentation with GitLab Pages from the default branch
pages:
  stage: deploy
  <<: *docs_base
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


