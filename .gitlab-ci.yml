# A single pipeline per push: the merge request pipeline when a merge request is open for
# the branch, the branch pipeline otherwise (and the tag pipelines)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # Fresh and full clone in every job: the shallow fetches of the runner failed with
  # "missing blob object" after an object was restored on the server (full clones work)
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: recursive
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CI_BASE_IMAGE: "python:3.12"
  PYTEST_WORKERS: 4  # pytest-xdist processes in the test jobs
  # ccache: the object files are reused from one pipeline to the next (GitLab cache)
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_BASEDIR: "$CI_PROJECT_DIR"
  CCACHE_MAXSIZE: "2G"
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

# Jobs that compute the package version (setuptools_scm) need the full history and the
# tags. A fresh clone avoids reusing a shallow repository left on the runner by the other
# jobs (fetching the missing history into it fails with "missing blob object").
.full_history: &full_history
  GIT_DEPTH: 0
  GIT_STRATEGY: clone

.linux_aff3ct_base: &linux_aff3ct_base
  image: $CI_BASE_IMAGE
  tags:
    - x86
    - docker
  # Without rules, a job is excluded from the merge request pipelines. The scheduled
  # pipelines only run `update-streampu`.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends gcc g++ cmake git ccache lcov libjson-xs-perl  # JSON::XS: faster lcov
    - python --version  # For debugging
    - python -m venv venv
    - . venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install pybind11==3.0.4  # same version as pyproject.toml

.python_cache: &python_cache
  key: ${CI_PROJECT_PATH}
  paths:
    - .cache/  # pip

# Object files of ccache, only for the jobs that compile (one cache per job: the compilation
# options differ between build-linux and coverage-cpp)
.ccache_cache: &ccache_cache
  key: ccache-${CI_JOB_NAME}
  paths:
    - .ccache/

stages:
  - linting
  - build
  - tests
  - coverage-linux
  - build-wheels
  - docs
  - deploy


build-linux:
  stage: build
  <<: *linux_aff3ct_base

  cache:
    - *python_cache
    - *ccache_cache

  # Only the wheel is kept: the next jobs install it in their own environment
  artifacts:
    name: streampu-wheel
    paths:
      - dist/
    expire_in: 1 day

  script:
    - export CC="gcc"
    - export CXX="g++"
    - python -m pip wheel . --no-deps -w dist -v -Ccmake.define.SPU_OVERRIDE_VERSION=v0.0.0
    - ccache --show-stats
    - ls -lh dist


tests:
  stage: tests
  <<: *linux_aff3ct_base

  cache:
    <<: *python_cache

  dependencies:
    - build-linux

  script:
    - python -m pip install dist/*.whl  # wheel of build-linux
    - python -m pip install pytest pytest-xdist  # not dependencies of streampu: install them explicitly
    - python -m pip show -f streampu
    - pytest tests -n $PYTEST_WORKERS --junitxml=report.xml

  artifacts:
    when: always
    reports:
      junit: report.xml


# Run the examples of the documentation and compare their results with the outputs
# written in the pages (the C++ module example is skipped: it is not built here)
tutorial:
  stage: tests
  <<: *linux_aff3ct_base

  cache:
    <<: *python_cache

  dependencies:
    - build-linux

  script:
    - python -m pip install dist/*.whl  # wheel of build-linux
    - python scripts/check_tutorial.py

# Check that the committed stubs of streampu._ext match the C++ bindings
stubs:
  stage: tests
  <<: *linux_aff3ct_base
  allow_failure: true

  cache:
    <<: *python_cache

  dependencies:
    - build-linux

  script:
    - python -m pip install dist/*.whl  # wheel of build-linux
    - python -m pip install pybind11-stubgen==2.5.5 black==26.5.1 isort==8.0.1  # same as pyproject.toml
    - python -m pip list 2>/dev/null | grep -i -E "^(pybind11|pybind11-stubgen|black|isort) "
    - ./scripts/generate_stubs.sh
    - git diff -- streampu/_ext > stubs.diff
    - test ! -s stubs.diff || (echo "Stubs are outdated, run scripts/generate_stubs.sh"; git diff --stat; head -n 80 stubs.diff; exit 1)

  artifacts:
    when: on_failure
    name: stubs-diff
    paths:
      - stubs.diff
    expire_in: 1 week


coverage-python:
  stage: coverage-linux
  <<: *linux_aff3ct_base

  cache:
    <<: *python_cache

  coverage: '/.*lines\.*: (\d+.\d+\%)/'
  artifacts:
    name: python-coverage-report
    when: always
    paths:
      - htmlcov/
      - coverage.lcov
    expire_in: 1 week
  dependencies:
    - build-linux
  script:
    - python -m pip install dist/*.whl  # wheel of build-linux
    - python -m pip install pytest-cov pytest-xdist
    # -P: do not import the `streampu/` folder of the repository instead of the installed package
    - python -P -c "import streampu; print('streampu loaded from:', streampu.__file__)"
    - pytest tests -n $PYTEST_WORKERS --cov --cov-report=html --cov-report=term --cov-report=lcov

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

coverage-cpp:
  stage: coverage-linux
  <<: *linux_aff3ct_base
  timeout: 2h
  allow_failure: true
  variables:
    # With a base directory, ccache makes the paths of the compilation relative, and gcov
    # then writes its .gcda files relative to the folder of the tests, not in the build
    # folder. The paths of the job do not change, so the cache still works without it.
    CCACHE_BASEDIR: ""

  cache:
    - *python_cache
    - *ccache_cache

  artifacts:
    name: cpp-coverage-report
    when: always
    paths:
      - code_coverage_report/
      - code_coverage_files/
    reports:
      junit: report-cpp.xml
  script:
    - python -m pip install lcov-cobertura pytest pytest-xdist
    - export CXX="g++"
    - export CFLAGS="-g -Wall -funroll-loops -fvisibility=hidden -fvisibility-inlines-hidden"  # coverage flags: PYSTREAMPU_COVERAGE
    - pwd
    - ./ci/coverage-cpp-linux.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

isort:
  stage: linting
  <<: *linux_aff3ct_base

  script:
    - python -m pip install isort==8.0.1
    - isort ./streampu --check-only
    - isort ./examples --check-only

black:
  stage: linting
  <<: *linux_aff3ct_base

  script:
    - python -m pip install black==26.5.1
    - black --check ./streampu
    - black --check ./examples

flake8:
  stage: linting
  <<: *linux_aff3ct_base

  script:
    - python -m pip install flake8
    - flake8 ./streampu
    - flake8 ./examples


build-wheels-linux:
  stage: build-wheels
  image: $CI_BASE_IMAGE
  tags:
    - x86
    - docker

# make a docker daemon available for cibuildwheel to use
  services:
    - name: docker:dind
      entrypoint: ["env", "-u", "DOCKER_HOST"]
      command: ["dockerd-entrypoint.sh"]
  variables:
    <<: *full_history
    NO_PROXY: "docker"
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    # See https://github.com/docker-library/docker/pull/166
    DOCKER_TLS_CERTDIR: ""
  # One job per Python version (3.14t: free-threaded, without GIL). macOS and Linux aarch64
  # are built on the Apple Silicon runner (jobs below); no Windows wheels for now.
  parallel:
    matrix:
      - PYTHON_VERSION: ["cp310", "cp311", "cp312", "cp313", "cp314", "cp314t"]
  script:
    - curl -sSL https://get.docker.com/ | sh
    - python -m pip install cibuildwheel==4.3.5
    - CIBW_BUILD="$PYTHON_VERSION-*" cibuildwheel --platform linux --archs x86_64 --output-dir wheelhouse
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 week  # kept until the publication, which waits for all the wheels
  rules: &wheels_rules
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"  # Build > Pipelines > Run pipeline, to test the wheels

# Wheels built on the Apple Silicon runner (macOS, shell executor, tag `macos-arm64`). It
# needs: Python >= 3.11 (to run cibuildwheel), the Xcode command line tools, Rosetta (to
# test the x86_64 wheels), Colima and the docker command (Linux aarch64 wheels), and the
# right to run `sudo /usr/sbin/installer` without password (cibuildwheel installs the
# python.org builds of Python). See docs/dev_guidelines.md.
.apple_silicon_wheels: &apple_silicon_wheels
  stage: build-wheels
  tags:
    - macos-arm64
  variables:
    <<: *full_history
  parallel:
    matrix:
      - PYTHON_VERSION: ["cp310", "cp311", "cp312", "cp313", "cp314", "cp314t"]
  before_script:
    - python3 -m venv .venv-cibw
    - .venv-cibw/bin/python -m pip install --upgrade pip cibuildwheel==4.3.5
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 week
  rules: *wheels_rules

# macOS arm64 (native) and x86_64 (cross-compiled, tested with Rosetta)
build-wheels-macos:
  <<: *apple_silicon_wheels
  script:
    - CIBW_BUILD="$PYTHON_VERSION-*" .venv-cibw/bin/cibuildwheel --platform macos --archs "arm64 x86_64" --output-dir wheelhouse

# Linux aarch64, native in the Docker engine of Colima (its virtual machine is aarch64).
# Colima is started by the job when it is not running.
build-wheels-linux-aarch64:
  <<: *apple_silicon_wheels
  before_script:
    # Two jobs may start it at the same time: the second `colima start` fails, `colima status` then succeeds
    - colima status >/dev/null 2>&1 || colima start --arch aarch64 --cpu "${COLIMA_CPUS:-8}" --memory "${COLIMA_MEMORY:-16}" || colima status
    - docker info --format "Docker {{.ServerVersion}} on {{.Architecture}}"
    - python3 -m venv .venv-cibw
    - .venv-cibw/bin/python -m pip install --upgrade pip cibuildwheel==4.3.5
  script:
    - CIBW_BUILD="$PYTHON_VERSION-*" .venv-cibw/bin/cibuildwheel --platform linux --archs aarch64 --output-dir wheelhouse

# Build the source distribution, then build and test the package from it alone (outside of
# the repository, without git), as pip does on a platform without wheels
sdist:
  stage: build-wheels
  <<: *linux_aff3ct_base
  variables:
    <<: *full_history

  script:
    - python -m pip install build
    - SPU_TAG=$(git -C lib/streampu describe --tags --abbrev=0 2>/dev/null || echo unknown)
    - SPU_SET=$(grep -oP 'SPU_OVERRIDE_VERSION = "\K[^"]+' pyproject.toml)
    - test "$SPU_TAG" = "$SPU_SET" || echo "WARNING - StreamPU submodule is $SPU_TAG but pyproject.toml says $SPU_SET (SPU_OVERRIDE_VERSION)"
    - python -m build --sdist --outdir dist
    - ls -lh dist
    - mkdir -p /tmp/from-sdist && tar xzf dist/*.tar.gz -C /tmp/from-sdist
    - python -m venv /tmp/venv-sdist
    - /tmp/venv-sdist/bin/python -m pip install --upgrade pip pytest
    - /tmp/venv-sdist/bin/python -m pip install dist/*.tar.gz
    - cd /tmp && /tmp/venv-sdist/bin/pytest /tmp/from-sdist/streampu-*/tests

  artifacts:
    paths:
      - dist/
    expire_in: 1 week

  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Upload the wheels and the sdist of a tag on TestPyPI (default) or PyPI. Needs the masked
# and protected variable PYPI_API_TOKEN (API token of TestPyPI or PyPI) and protected tags
# `v*` (Settings > Repository > Protected tags). To publish on PyPI, set the variable
# PYPI_REPOSITORY_URL to https://upload.pypi.org/legacy/ with the token of PyPI.
# Single origin of the publication: the GitHub workflow only builds, on demand.
publish:
  stage: deploy
  image: $CI_BASE_IMAGE
  tags:
    - x86
    - docker
  needs:
    - job: build-wheels-linux
      artifacts: true
    - job: build-wheels-macos
      artifacts: true
    - job: build-wheels-linux-aarch64
      artifacts: true
    - job: sdist
      artifacts: true
  variables:
    TWINE_USERNAME: __token__
    TWINE_NON_INTERACTIVE: "1"
  script:
    - test -n "$PYPI_API_TOKEN" || (echo "PYPI_API_TOKEN is not set (masked and protected variable)"; exit 1)
    - python -m pip install twine
    - ls -l wheelhouse dist
    - python -m twine check --strict wheelhouse/*.whl dist/*.tar.gz
    - python -m twine upload --repository-url "${PYPI_REPOSITORY_URL:-https://test.pypi.org/legacy/}" -p "$PYPI_API_TOKEN" wheelhouse/*.whl dist/*.tar.gz
  rules:
    - if: $CI_COMMIT_TAG


# ---------------------------------------------------------------------------
# Integration of the new versions of StreamPU
# ---------------------------------------------------------------------------
# Run by a pipeline schedule (Build > Pipeline schedules) on the default branch, with the
# variable STREAMPU_UPDATE=true. When StreamPU has a newer version than the embedded one,
# ci/update_streampu.py creates the branch `streampu-X.Y.Z` and opens a merge request
# whose description is the integration plan (draft when the API of StreamPU changes).
# Needs the masked variable STREAMPU_BOT_TOKEN: project access token, role Developer,
# scopes `api` and `write_repository`.
update-streampu:
  stage: build
  image: $CI_BASE_IMAGE
  tags:
    - x86
    - docker
  variables:
    <<: *full_history
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $STREAMPU_UPDATE == "true"
  script:
    - python ci/update_streampu.py
  artifacts:
    when: always
    paths:
      - streampu-update-plan.md
    expire_in: 1 week


# ---------------------------------------------------------------------------
# Documentation (MkDocs + GitLab Pages)
# ---------------------------------------------------------------------------
# The documentation does not need the compiled package: mkdocstrings reads the Python
# sources and the committed type stubs of streampu._ext (scripts/generate_stubs.sh), so
# these jobs only install MkDocs. Keep the package list in sync with the `docs` extra of
# pyproject.toml.
.docs_base: &docs_base
  image: $CI_BASE_IMAGE
  tags:
    - x86
    - docker
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install mkdocs mkdocs-material "mkdocstrings[python]" pymdown-extensions

# Check that the documentation builds on merge requests
docs:
  stage: docs
  <<: *docs_base
  script:
    - mkdocs build --strict --site-dir site
  artifacts:
    name: docs-preview
    paths:
      - site/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Publish the documentation with GitLab Pages from the default branch
pages:
  stage: deploy
  <<: *docs_base
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"


