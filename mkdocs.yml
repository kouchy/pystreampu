site_name: StreamPU (Python API)

repo_url: https://gitlab.inria.fr/fec/pystreampu

nav:
  - Home: index.md
  - Setup: install.md
  - Socket operations: socket_operations.md
  - Getting started:
    - First steps: first_steps.md
    - Module, Task and Socket:
      - Module: module.md
      - Task: task.md
      - Socket: socket.md
    - Back to the first steps: back_to_first_steps.md

plugins:
  - search

# - mkdocstrings

theme:
  name: material
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.expand
    - navigation.footer

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true


