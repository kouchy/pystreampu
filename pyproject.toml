[build-system]
requires = ["scikit-build-core", "setuptools_scm", "pybind11==3.0.4"]
build-backend = "scikit_build_core.build"

[project]
name = "streampu"
authors = [{name = "AFF3CT Team", email= "aff3ct-contact@inria.fr"}]
requires-python = ">=3.8"
description = "Python wrapper for StreamPU library."
license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
    "importlib_metadata",
    "numpy",
    "pybind11==3.0.4",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://rtajan.pages.bordeaux-inp.fr/pystreampu/"
Source = "https://gitlab.bordeaux-inp.fr/rtajan/pystreampu"
Issues = "https://gitlab.bordeaux-inp.fr/rtajan/pystreampu/-/issues"

[project.optional-dependencies]
dev = [
  "flake8",
  # Pinned: the CI regenerates the stubs and checks the formatting with the same versions
  "isort==8.0.1",
  "black==26.5.1",
  "pytest>=6.0",
  "pybind11-stubgen==2.5.5",
  "pre-commit",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "pymdown-extensions",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux2014"
before-all = "uname -a"
build-verbosity = 3
test-requires = "pytest"
before-test = "pwd && ls -la"
test-command = "pytest {package}/tests --junitxml=./streampu/report.xml"
skip = ["*-musllinux*"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "universal2", "arm64"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

# On an Linux Intel runner with qemu installed, build Intel and ARM wheels
[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.scikit-build]
# One build folder per interpreter (e.g. build/cp312-cp312-macosx_14_0_arm64): a shared
# folder mixes the extension modules built for different Python versions
build-dir = "build/{wheel_tag}"
cmake.define.CMAKE_CXX_FLAGS ="-Wall -funroll-loops -fvisibility=hidden -fvisibility-inlines-hidden"
wheel.packages = ["streampu"]
wheel.license-files = ["LICENSE"]
wheel.install-dir = "streampu"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["streampu/_version.py"]

[tool.setuptools_scm]  # Section required
write_to = "streampu/_version.py"
version_scheme = "post-release"

[[tool.scikit-build.generate]]
path = "streampu/_version.py"
template = '''
version = "${version}"
'''

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
# Explicit target: the oldest supported version. Black formats for the features common to
# all its targets, so this is the same formatting as listing every version >= 3.8, without
# the warning raised when a target is newer than the running interpreter.
target-version = ["py38"]

[tool.coverage.run]
omit = [
  "streampu/_version.py",
  "streampu/_plugins.py",

]

[tool.coverage.report]
omit = [
  "streampu/_version.py",
  "streampu/_plugins.py",
]
