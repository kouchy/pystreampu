# Build the wheels of all the platforms and the sdist, and publish them on tags.
#
# GitLab CI (gitlab.bordeaux-inp.fr) only has Linux x86_64 runners: this workflow runs on
# the GitHub mirror, where GitHub provides macOS, Windows and Linux ARM runners. The Python
# versions come from `requires-python` and the options from [tool.cibuildwheel] in
# pyproject.toml.
#
# Publication uses PyPI trusted publishing: declare this repository and workflow
# (`wheels.yml`, environment `testpypi` or `pypi`) as a trusted publisher on the project
# page of TestPyPI / PyPI. No token is needed.
name: wheels

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # Linux x86_64
          - ubuntu-24.04-arm   # Linux aarch64
          - macos-14           # macOS arm64
          - macos-15-intel     # macOS x86_64
          - windows-latest     # Windows AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # tags, for the version computed by setuptools_scm
      - uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      # When the TestPyPI release is validated, publish on PyPI instead: use the
      # environment `pypi` above and remove `repository-url`.
