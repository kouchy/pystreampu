# Build the wheels of all the platforms and the sdist, on demand only (Actions > wheels >
# Run workflow). It does not publish anything.
#
# The wheels that are published are built and uploaded by GitLab CI
# (gitlab.bordeaux-inp.fr, jobs build-wheels-* and publish): Linux x86_64 on the x86
# runner, macOS and Linux aarch64 on the Apple Silicon runner. This workflow stays useful to
# test a platform that GitLab does not cover (Windows). The Python versions come from
# `requires-python` and the options from [tool.cibuildwheel] in pyproject.toml.
name: wheels

on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }} ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One job per platform and Python version: each wheel compiles the whole of StreamPU,
      # about 25 minutes, so building the versions one after the other is too slow
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314, cp314t]
        os:
          - ubuntu-latest      # Linux x86_64
          - ubuntu-24.04-arm   # Linux aarch64
          - macos-14           # macOS arm64
          - macos-15-intel     # macOS x86_64
          - windows-latest     # Windows AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # tags, for the version computed by setuptools_scm
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
